# Local services for development: PostgreSQL, MinIO (S3-compatible storage), Mailpit (catches mail).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bakban9
      POSTGRES_PASSWORD: bakban9
      POSTGRES_DB: bakban9
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bakban9
      MINIO_ROOT_PASSWORD: bakban9-minio
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  minio:
