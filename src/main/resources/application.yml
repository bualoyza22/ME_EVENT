spring:
  application:
    name: bakban9
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bakban9}
    username: ${DATABASE_USER:bakban9}
    password: ${DATABASE_PASSWORD:bakban9}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 60MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  web:
    resources:
      cache:
        period: 7d

server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      timeout: 2h
      cookie:
        name: BAKBAN_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    whitelabel:
      enabled: false

bakban:
  base-url: ${BASE_URL:http://localhost:8080}
  cookie-secure: ${SESSION_COOKIE_SECURE:true}
  # first owner account, created on startup only when the admins table is empty
  owner:
    email: ${OWNER_EMAIL:}
    password: ${OWNER_PASSWORD:}
    name: ${OWNER_NAME:เจ้าของร้าน}
  seed:
    enabled: ${SEED_ENABLED:true}
  mail:
    from: ${MAIL_FROM:}
    # where new contact messages are announced; empty = use the shop email from Footer settings
    notify-to: ${MAIL_NOTIFY_TO:}
  storage:
    type: ${STORAGE_TYPE:local}          # local | s3
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:/media}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:auto}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:true}
  security:
    max-failed-logins: 5
    lock-minutes: 15
  rate-limit:
    form-max: ${FORM_RATE_MAX:5}
    form-window-minutes: ${FORM_RATE_WINDOW:10}
    login-max: 20
    login-window-minutes: 15
  retention:
    soft-delete-days: 30
